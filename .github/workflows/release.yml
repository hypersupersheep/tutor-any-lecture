name: release

# Only a pushed version tag (v + skills/tutor-any-lecture/VERSION) starts a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The tag must be v + VERSION, every place must carry the same id, and the
  # tagged commit must be on main. Nothing is installed: the check is standard library only.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Release identity
        run: python tools/release_check.py --tag "$GITHUB_REF_NAME" --on origin/main

  # CI's whole matrix is the suite a release must pass.
  test:
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: [check, test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release notes from CHANGELOG.md
        run: python tools/release_check.py --tag "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md"
      - name: Skill ZIPs
        run: python tools/build_skill_zip.py --out dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A -dev id is never tagged, so a tag with a hyphen is a release candidate.
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
